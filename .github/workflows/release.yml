name: Release

# One tag produces every artifact and updates every manifest.
#
# This is the whole reason the file exists. Each distribution channel below is a
# version string and a SHA256 in a file somewhere — trivially easy to write by
# hand, and therefore trivially easy to forget for one channel out of eight. Do
# that twice and `winget install` gives someone 0.3.0 while `brew install` gives
# them 0.5.0 and the bug reports become unreadable. It is the same duplication
# the codebase already refuses elsewhere: RELAY_HTTP_URL is derived rather than
# written twice, LINKS comes from one constant, the service worker's precache
# list is generated rather than maintained.
#
# Triggered by the same `v*` tag that deploys the site, so the app, the CLI, the
# desktop builds and the relay image all carry one version.

# A `v*` tag is the ONLY thing that runs this, and that is the whole trigger
# list on purpose. There was a `workflow_dispatch` here, for re-running a
# release whose macOS leg had failed. It cost more than it saved: dispatched off
# a branch, `github.ref_name` is a BRANCH name, and everything below builds a
# version string out of it — so a dispatch off main would have tagged the
# release "main" and handed the manifests a URL for "vmain". The guard that
# caught it had to be the first step of the first job, and a guard whose only
# job is to reject the trigger above it is an argument for deleting the trigger.
# Re-running a release is `gh run rerun`, which keeps the tag it started from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Nothing is published before the tests that need no browser have passed.
  # A bad release can be yanked from npm; it cannot be un-downloaded from a
  # GitHub release page that Google has already indexed.
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, because the check below needs main's history and a tag
      # checkout is otherwise a single commit with no branches at all.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      # A tag says nothing about which branch it came from, and the ruleset on
      # main does not cover tags — `git tag v9.9.9 && git push origin v9.9.9`
      # on a feature branch is a release of that branch, from a commit that was
      # never reviewed and may never land. docs/RELEASING.md leans on tags being
      # unprotected to recover from the ruleset refusing the release commit, so
      # the hole is one this project uses deliberately and has to close here
      # instead: ancestry, not the ref name. The tagged commit must be one main
      # already contains.
      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::${{ github.ref_name }} points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          echo "releasing ${{ github.ref_name }} from $GITHUB_SHA, which main contains"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: node tests/dom/bundle.mjs
      - run: node tests/live/e2e.mjs
      - run: node tests/live/cli.mjs

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          - os: macos-latest
            # One binary for Intel and Apple Silicon. Two separate downloads on
            # a page that says "download for Mac" is a question nobody should
            # have to answer about their own laptop.
            target: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            # 22.04, not latest: the oldest runner with webkit2gtk 4.1. Building
            # on a newer one silently raises the glibc floor and the binary then
            # refuses to start on the distributions we claim to support.
            target: ""
    runs-on: ${{ matrix.os }}
    # Spelled out because a job-level block REPLACES the workflow-level one
    # rather than merging with it — omitting `contents: write` here would leave
    # tauri-action unable to create the draft release, and the failure reads as
    # a token problem rather than a permissions one.
    #
    # id-token and attestations are for the provenance step at the end of this
    # job. They are granted here and not at the workflow level so `relay-image`
    # and `manifests` cannot mint an attestation in this repository's name.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # tauri.conf.json's beforeBuildCommand runs tools/build/build.mjs, which
      # imports esbuild. Without the devDependencies the bundle step fails
      # inside the frontend build with "Cannot find package 'esbuild'".
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        # libssl-dev is here to match .github/workflows/desktop.yml. A compile
        # that passes the cheap check and then fails here does so on a tag, in
        # front of users, which is the one place it must not.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                                  librsvg2-dev patchelf libssl-dev

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: desktop/src-tauri

      # Windows signing, only when the certificate exists. The thumbprint is
      # written into the config here rather than committed, so a local build
      # and a fork both still work with `certificateThumbprint: null`.
      - name: Windows signing certificate
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $c = Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item cert.pfx
          node -e "const f='desktop/src-tauri/tauri.conf.json',fs=require('fs');const j=JSON.parse(fs.readFileSync(f));j.bundle.windows.certificateThumbprint=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2))" $c.Thumbprint

      # !! The APPLE_* variables are exported HERE, and only when a certificate
      # actually exists, rather than being listed on the step below.
      #
      # `APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}` with no such
      # secret does not leave the variable unset — it sets it to the empty
      # string. Tauri tests for PRESENCE, so it takes the signing path anyway
      # and dies importing a certificate that is not there:
      #
      #   failed to bundle project: failed codesign application:
      #   failed to run command security import
      #
      # That failed the macOS leg of v0.3.0 twice while Windows, Linux, npm and
      # the relay image all went green. Not defining them at all is the only
      # thing that makes Tauri skip signing. !!
      - name: Apple signing, when there is something to sign with
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s<<__EOF__\n%s\n__EOF__\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configPath: desktop/src-tauri/tauri.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: RealtimeClipboard ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target }}

      # ── Build provenance ───────────────────────────────────────────────────
      #
      # What a user can check, and why this is the strongest thing here.
      #
      # The installers are UNSIGNED (tauri.conf.json: certificateThumbprint and
      # signingIdentity are both null), so Windows and macOS warn on first run
      # and nothing in the binary says who built it. `SHA256SUMS`, attached by
      # the publish-release job, is a fixed value worth quoting elsewhere — but
      # it is served from the same release as the assets, so anyone able to
      # swap one could swap both.
      #
      # An attestation is not. It is signed through Sigstore against an OIDC
      # token this workflow run cannot fabricate and a third party holds the
      # log, so it binds each binary to the commit and workflow that produced
      # it, verifiably by someone who trusts neither this repository nor its
      # release page:
      #
      #     gh attestation verify RealtimeClipboard_0.5.0_x64-setup.exe \
      #        --repo akshaynikhare/RealtimeClipboard
      #
      # This is the same guarantee `npm publish --provenance` already gives the
      # CLI, which is why it belongs here rather than being an extra.
      #
      # !! It does NOT remove the SmartScreen or Gatekeeper warning. Nothing
      # replaces code signing for that; see docs/RELEASING.md. Provenance
      # answers "did this come from that source", not "may this run". !!
      #
      # Paths come from the action's own `artifactPaths` output rather than a
      # hand-written glob: the bundle layout differs per platform and moves
      # between Tauri versions, and a glob that silently matches nothing would
      # attest nothing while going green.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}

  npm:
    needs: verify
    runs-on: ubuntu-latest
    # --provenance mints a signed attestation through OIDC, which needs this
    # token. Granted to this job alone: desktop and relay-image have no
    # business minting one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      # `npx realtimeclipboard` installs src/core and src/transport — the same modules the
      # browser runs. There is nothing to build, which is the point.
      #
      # Skipped rather than failed when NPM_TOKEN is absent, so a fork — and the
      # first tag cut before the token exists — still produces installers
      # instead of a red workflow. The `secrets` context is not available in a
      # job-level `if`, hence the env indirection.
      # Skipped when the version is already up. A release that has to be re-run
      # because one platform failed must not go red on the one job that
      # succeeded the first time — npm refuses to republish a version, and
      # rightly so.
      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "realtimeclipboard@$V" version >/dev/null 2>&1; then
            echo "realtimeclipboard@$V is already published — nothing to do."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  relay-image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: backend
          push: true
          # arm64 as well as amd64: a meaningful share of self-hosters are
          # running this on a Raspberry Pi or an ARM VPS, which is exactly the
          # audience for a relay you host yourself.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/realtimeclipboard-relay:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/realtimeclipboard-relay:latest

  # ── publish ──────────────────────────────────────────────────────────────
  # tauri-action creates the release as a DRAFT and every matrix leg uploads
  # into it. This is the job that makes it public, and it is deliberately not
  # `releaseDraft: false` on the action itself: the release is created by
  # whichever leg wins the race, and fail-fast is off, so a macOS failure would
  # publish a release advertising a .dmg that does not exist.
  #
  # Needing all three legs means a partial build leaves a draft nobody can
  # download, which is the correct failure mode. It also matters to the page:
  # /download/ reads the releases API, and /releases/latest skips drafts — so
  # until this runs, the buttons keep pointing at the generic releases page.
  #
  # ── the MCP server ───────────────────────────────────────────────────────
  # Its own npm package, and a second channel like `npm` above: an external
  # registry with a token that expires, so NOTHING waits on it.
  #
  # The published package is the BUNDLE — build-mcp.mjs stages a package root
  # with no dependencies, because the source imports ../cli/ and ../src/, which
  # resolve to nothing once installed. That script also spawns the result and
  # speaks MCP at it, so a bundle that cannot start fails here rather than on
  # somebody's machine.
  mcp:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run build:mcp
      # Same skip-not-fail and same idempotence as the `npm` job, and for the
      # same two reasons: a fork has no token, and a re-run after one platform
      # failed must not go red on the channel that already succeeded.
      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: mcp/dist/pkg
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "realtimeclipboard-mcp@$V" version >/dev/null 2>&1; then
            echo "realtimeclipboard-mcp@$V is already published — nothing to do."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── the browser extension ────────────────────────────────────────────────
  # Builds the store zip and attaches it to the draft. It does NOT submit: a
  # Chrome Web Store upload needs OAuth credentials and every submission enters
  # a review queue, so automating it would replace a deliberate act with a
  # surprise. The asset is what makes sideloading and the manual upload possible,
  # and it needs no token, so publish-release can wait on it.
  browser:
    needs: verify             # NOT desktop — see publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run package:browser
      # Handed to publish-release as a workflow artifact rather than uploaded to
      # the draft here, which is what lets this job run without waiting for the
      # release to exist — and therefore without waiting for desktop.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: browser-zip, path: browser/dist/*.zip, if-no-files-found: error }

  # Edge Add-ons is the one Chromium store with no registration fee, which is
  # why this exists and Chrome does not: the same zip, on a store that gives
  # one-click install and auto-update, for nothing.
  #
  # A separate job from `browser` and nothing waits on it, for the reason the
  # rest of this file already gives — it holds a key that expires, and Edge API
  # keys do expire. `browser` keeps producing the release asset either way, so
  # a lapsed key costs the store listing and not the download.
  edge-publish:
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with: { name: browser-zip, path: dist }
      # The script skips itself when the credentials are absent, so this needs no
      # `if:` — and unlike one, it says WHY it did nothing in the log.
      - name: Microsoft Edge Add-ons
        run: node tools/release/edge-publish.mjs dist/*.zip
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

  # ── the VS Code extension ────────────────────────────────────────────────
  # Two jobs on purpose, and the split is the same lesson the npm job records.
  #
  # `vscode` only builds the .vsix and attaches it to the draft. It needs no
  # external token, so it cannot fail for a reason outside this repository —
  # which is what makes it safe for publish-release to wait on, and what earns
  # the .vsix a line in SHA256SUMS and a sideloadable asset.
  #
  # `vscode-publish` talks to two registries with two tokens that expire, and
  # NOTHING waits on it. An expired Marketplace PAT must not hide three
  # perfectly good installers behind a draft nobody can reach.
  vscode:
    needs: verify             # NOT desktop — see publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # --package shells out to `npx @vscode/vsce`, which is deliberately not a
      # devDependency: it pulls a large tree and is only ever wanted here. Three
      # devDependencies is a stated property of this repo.
      - run: npm run package:vscode
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: vsix, path: vscode/dist/*.vsix, if-no-files-found: error }

  vscode-publish:
    needs: vscode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: 22 }
      # From the workflow artifact, NOT the release: publishing to a marketplace
      # has nothing to do with whether a GitHub release exists, and reading it
      # from there is what used to make this wait on desktop.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with: { name: vsix, path: dist }
      # Skipped rather than failed when the token is absent, so a fork — and the
      # first tag cut before the publisher ID exists — still produces a .vsix
      # instead of a red workflow. The `secrets` context is not available in a
      # job-level `if`, hence the env indirection.
      #
      # --skip-duplicate for the same reason the npm job checks `npm view`
      # first: a release re-run after one platform failed must not go red on the
      # channel that succeeded the first time. Neither registry will replace a
      # published version, and rightly so.
      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath dist/*.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # VSCodium, Cursor, Windsurf, Gitpod and code-server: none of them may use
      # the Microsoft Marketplace, so this is not a nice-to-have second channel.
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish dist/*.vsix --skip-duplicate -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # `needs: [desktop, vscode, browser]` — the three jobs that produce a RELEASE
  # ASSET. Not npm, mcp, vscode-publish or edge-publish: those talk to external
  # registries
  # with tokens that expire, and coupling them means one expired token hides
  # three perfectly good installers behind a draft nobody can reach. That is
  # what happened on the first attempt at v0.3.0.
  #
  # The arrow only points this way. vscode and browser used to be `needs:
  # desktop`, because they uploaded to the draft and tauri-action is what
  # creates it — so on v0.7.0 a Windows Rust build failure skipped the VS Code
  # extension, the browser zip and the whole release, none of which had anything
  # to do with it. They build in parallel now and hand their output here as
  # workflow artifacts, and vscode-publish reaches a marketplace without caring
  # whether a GitHub release exists at all.
  publish-release:
    needs: [desktop, vscode, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      # Attached BEFORE the release goes public, so there is no window in which
      # an installer is downloadable and unverifiable.
      #
      # What this is and is not. The installers are unsigned — tauri.conf.json
      # has certificateThumbprint and signingIdentity both null — so Windows and
      # macOS will warn on first run and nothing in the binary itself says who
      # built it. A checksum file served from the same release does not fix
      # that: anyone who could replace the asset could replace this too. What it
      # DOES give is a fixed value that can be quoted in the release notes, in a
      # package manifest and in a mirror's own records, so that a substitution
      # after the fact is detectable by anyone who wrote the number down.
      # Signing is the real answer and is tracked in docs/RELEASING.md.
      # The two surfaces that no longer upload for themselves. They built in
      # parallel with desktop; their output joins the release here, which is the
      # first moment a release is guaranteed to exist.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with: { pattern: "{vsix,browser-zip}", merge-multiple: true, path: staged }
      - name: Attach the extension builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" staged/* --clobber

      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist && cd dist
          # Every asset already attached, which is why the vscode job has to have
          # finished — see this job's `needs`.
          gh release download "${{ github.ref_name }}" --pattern '*' --skip-existing
          # Sorted, so the file is byte-identical for the same set of assets
          # whatever order the matrix finished in — a diff between two runs
          # should mean the artifacts changed, not the weather.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' \
            | LC_ALL=C sort \
            | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false --latest
          echo "### Published ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          gh release view "${{ github.ref_name }}" --json assets \
            --jq '.assets[] | "- \(.name)  (\(.size) bytes)"' >> "$GITHUB_STEP_SUMMARY"

  # ── the manifests ────────────────────────────────────────────────────────
  # Each of these is a version and a checksum. They run after the artifacts
  # exist, and they are the step that would otherwise be done by hand, once,
  # per channel, and then forgotten for one of them.
  manifests:
    # publish-release, NOT desktop — manifest.mjs fetches each asset to hash it,
    # and a draft release's assets are 404 to an unauthenticated request. This
    # job could therefore never have succeeded, even on a completely green
    # build, until the release was public.
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      # Two channels, not five. A Scoop bucket and an AUR package are each a
      # repository somebody has to keep in step with every release, and one that
      # has quietly stopped being updated is worse than one that never existed:
      # it hands people an old build and tells them it is current.
      - name: Homebrew tap
        run: node tools/release/manifest.mjs homebrew ${{ github.ref_name }}

      - name: winget manifest
        run: node tools/release/manifest.mjs winget ${{ github.ref_name }}

      - name: Open the manifest updates
        run: |
          # Deliberately pull requests rather than direct pushes. These land in
          # repositories other people also touch, and a bot force-pushing a tap
          # is how a tap acquires a reputation.
          node tools/release/manifest.mjs publish ${{ github.ref_name }}

      # Without this the generated files are written into a runner that is then
      # destroyed, and the step above prints instructions for opening PRs from
      # files nobody can reach.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: manifests
          path: dist/manifests/
          if-no-files-found: error
